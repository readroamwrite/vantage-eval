[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-eval"
version = "0.1.0"
description = "Pluggable evaluation framework for LLMs and agents: trajectory-native scoring, measured judges, monitors, and eval-health diagnostics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "readroamwrite" }]
keywords = ["llm", "evaluation", "agents", "ai-safety", "llm-as-judge", "monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "matplotlib>=3.9"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "matplotlib>=3.9"]

[project.scripts]
vantage = "vantage.cli:main"

[project.urls]
Homepage = "https://github.com/readroamwrite/vantage-eval"

[tool.setuptools.packages.find]
include = ["vantage*"]

[tool.setuptools.package-data]
vantage = ["dashboard/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "N", "SIM", "RUF"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
